# RMT-Debrid configuration (TOML).
# Location: user config directory by default
#   macOS:   ~/Library/Application Support/RMT-Debrid/config.toml
#   Linux:   ~/.config/rmt-debrid/config.toml
#   Windows: %APPDATA%\RMT-Debrid\config.toml
# Override with RMT_CONFIG_FILE env var or --config flag. A config.toml next
# to the binary (or in its data/ dir) is picked up automatically for portable use.
# Precedence: defaults in code < this file < environment variables.

# Real-Debrid API key (https://real-debrid.com/apitoken).
# Leave empty on first run and complete setup in the web UI instead.
rd_api_key = ""

# Folder for completed downloads. Defaults to <data_dir>/downloads when empty.
# download_folder = "/Volumes/Media/Downloads"

# Local downloads running at once (1-20).
max_concurrent = 3

# Optional webhook notifications.
# webhook_url = "https://ntfy.example.com/downloads"
# webhook_token = ""
# All events: download.started, download.paused, download.resumed,
# download.rd_completed, download.completed, download.failed, download.cancelled
webhook_events = ["download.completed"]
